<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Allison Dzubak, Ph.D. — Founder, Katahdin Logic LLC. AI and data systems consultancy in Portland, Maine.">
  <title>Allison Dzubak — Katahdin Logic</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f3;
      --text-primary: #1a1a1a;
      --text-secondary: #5f5e5a;
      --text-tertiary: #888780;
      --border: rgba(0, 0, 0, 0.12);
      --border-strong: rgba(0, 0, 0, 0.22);
      --button-bg: #1a1a1a;
      --button-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1f1d;
        --bg-secondary: #161614;
        --text-primary: #f5f5f3;
        --text-secondary: #b4b2a9;
        --text-tertiary: #888780;
        --border: rgba(255, 255, 255, 0.13);
        --border-strong: rgba(255, 255, 255, 0.25);
        --button-bg: #f5f5f3;
        --button-text: #1a1a1a;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--bg);
      border-radius: 24px;
      border: 0.5px solid var(--border);
      padding: 36px 28px 28px;
    }

    .photo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .photo {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 0.5px solid var(--border);
      background: var(--bg-secondary);
      display: block;
    }

    .info {
      text-align: center;
      margin-bottom: 24px;
    }

    .name {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.3;
      margin: 0 0 6px 0;
      color: var(--text-primary);
    }

    .title {
      font-size: 15px;
      color: var(--text-secondary);
      margin: 0 0 10px 0;
      font-weight: 400;
    }

    .location {
      font-size: 13px;
      color: var(--text-tertiary);
      margin: 0;
      font-weight: 400;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .note-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 0.5px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }

    .note-input::placeholder {
      color: var(--text-tertiary);
    }

    .note-input:focus {
      border-color: var(--border-strong);
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 16px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.08s, background 0.15s;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
    }

    .button:active {
      transform: scale(0.985);
    }

    .button-primary {
      background: var(--button-bg);
      color: var(--button-text);
      border: none;
    }

    .button-primary:hover {
      opacity: 0.9;
    }

    .button-secondary {
      background: transparent;
      color: var(--text-primary);
      border: 0.5px solid var(--border-strong);
    }

    .button-secondary:hover {
      background: var(--bg-secondary);
    }

    .button-spacer {
      height: 4px;
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      padding-top: 18px;
      border-top: 0.5px solid var(--border);
    }

    .footer a {
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="card">
      <div class="photo-wrapper">
        <img class="photo" src="headshot.jpg" alt="Allison Dzubak" id="headshot">
      </div>

      <div class="info">
        <h1 class="name">Allison Dzubak, Ph.D.</h1>
        <p class="title">Founder, Katahdin Logic</p>
        <p class="location">Portland, Maine</p>
      </div>

      <div class="actions">
        <input
          type="text"
          class="note-input"
          id="note-input"
          placeholder="Where we met (optional)"
          aria-label="Where we met (optional)"
          maxlength="200"
          autocomplete="off"
          autocapitalize="sentences"
        >

        <button type="button" class="button button-primary" id="save-button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
          Save contact
        </button>

        <div class="button-spacer"></div>

        <a class="button button-secondary" href="mailto:allison@katahdinlogic.com">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          Email
        </a>

        <a class="button button-secondary" href="https://www.linkedin.com/in/allisondzubak/" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
          LinkedIn
        </a>
      </div>

      <div class="footer">
        <a href="https://katahdinlogic.com">katahdinlogic.com</a>
      </div>
    </article>
  </main>

  <script>
    (function () {
      const CONTACT = {
        firstName: 'Allison',
        lastName: 'Dzubak',
        suffix: 'Ph.D.',
        title: 'Founder',
        org: 'Katahdin Logic LLC',
        email: 'allison@katahdinlogic.com',
        url: 'https://katahdinlogic.com',
        linkedin: 'https://www.linkedin.com/in/YOUR-LINKEDIN-USERNAME/',
        city: 'Portland',
        region: 'ME',
        country: 'USA'
      };

      const PHOTO_MAX_DIM = 300;
      const PHOTO_QUALITY = 0.82;

      function escapeVCardValue(text) {
        if (text == null) return '';
        return String(text)
          .replace(/\\/g, '\\\\')
          .replace(/\r/g, '')
          .replace(/\n/g, '\\n')
          .replace(/,/g, '\\,')
          .replace(/;/g, '\\;');
      }

      function foldVCardLine(line) {
        if (line.length <= 75) return line;
        const out = [line.slice(0, 75)];
        let i = 75;
        while (i < line.length) {
          out.push(' ' + line.slice(i, i + 74));
          i += 74;
        }
        return out.join('\r\n');
      }

      function getHeadshotBase64() {
        return new Promise((resolve) => {
          const img = document.getElementById('headshot');
          if (!img) return resolve(null);

          const generate = () => {
            try {
              const w = img.naturalWidth;
              const h = img.naturalHeight;
              if (!w || !h) return resolve(null);
              const scale = Math.min(PHOTO_MAX_DIM / w, PHOTO_MAX_DIM / h, 1);
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(w * scale);
              canvas.height = Math.round(h * scale);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              const dataUrl = canvas.toDataURL('image/jpeg', PHOTO_QUALITY);
              resolve(dataUrl.split(',')[1] || null);
            } catch (e) {
              resolve(null);
            }
          };

          if (img.complete && img.naturalWidth > 0) {
            generate();
          } else if (img.complete) {
            resolve(null);
          } else {
            img.addEventListener('load', generate, { once: true });
            img.addEventListener('error', () => resolve(null), { once: true });
          }
        });
      }

      function buildVCard(noteText, photoBase64) {
        const c = CONTACT;
        const fullName = c.firstName + ' ' + c.lastName + (c.suffix ? ', ' + c.suffix : '');
        const lines = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          'N:' + escapeVCardValue(c.lastName) + ';' + escapeVCardValue(c.firstName) + ';;;' + escapeVCardValue(c.suffix),
          'FN:' + escapeVCardValue(fullName),
          'TITLE:' + escapeVCardValue(c.title),
          'ORG:' + escapeVCardValue(c.org),
          'EMAIL;TYPE=INTERNET,WORK:' + escapeVCardValue(c.email),
          'URL:' + escapeVCardValue(c.url),
          'X-SOCIALPROFILE;TYPE=linkedin:' + escapeVCardValue(c.linkedin),
          'ADR;TYPE=WORK:;;;' + escapeVCardValue(c.city) + ';' + escapeVCardValue(c.region) + ';;' + escapeVCardValue(c.country)
        ];

        if (photoBase64) {
          lines.push('PHOTO;ENCODING=b;TYPE=JPEG:' + photoBase64);
        }

        const trimmedNote = (noteText || '').trim();
        if (trimmedNote.length > 0) {
          lines.push('NOTE:' + escapeVCardValue(trimmedNote));
        }

        const now = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
        lines.push('REV:' + now);
        lines.push('END:VCARD');

        return lines.map(foldVCardLine).join('\r\n');
      }

      function downloadVCard(text, filename) {
        const blob = new Blob([text], { type: 'text/vcard;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      const saveBtn = document.getElementById('save-button');
      saveBtn.addEventListener('click', async () => {
        saveBtn.disabled = true;
        try {
          const note = document.getElementById('note-input').value;
          const photo = await getHeadshotBase64();
          const vcard = buildVCard(note, photo);
          downloadVCard(vcard, 'Allison Dzubak.vcf');
        } finally {
          saveBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
